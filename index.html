<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威力彩號碼機率分析與預測</title>
<meta name="description" content="台灣彩券威力彩歷史開獎號碼機率統計分析，含冷熱號、遺漏值與下期號碼預測。基於 2008 年至今全部開獎資料。">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --gold:#f5b301; --red:#e5484d;
  --blue:#4493f8; --green:#3fb950; --purple:#bc8cff;
  --z1:#e5484d; --z2:#f5b301;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  background-image:radial-gradient(circle at 20% 0%,rgba(245,179,1,.06),transparent 40%),
                   radial-gradient(circle at 80% 10%,rgba(229,72,77,.06),transparent 40%);
}
.wrap{max-width:1100px; margin:0 auto; padding:0 16px 60px}
header{text-align:center; padding:48px 16px 32px}
header h1{font-size:2.1rem; font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--red));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
header .sub{color:var(--muted); margin-top:10px; font-size:.95rem}
.meta-bar{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:20px}
.meta-chip{background:var(--panel); border:1px solid var(--border); border-radius:20px;
  padding:6px 16px; font-size:.85rem; color:var(--muted)}
.meta-chip b{color:var(--gold); font-weight:700}
section{background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:24px; margin-top:24px}
section h2{font-size:1.3rem; margin-bottom:6px; display:flex; align-items:center; gap:10px}
section h2 .bar{width:4px; height:22px; border-radius:2px; background:var(--gold)}
section .hint{color:var(--muted); font-size:.85rem; margin-bottom:18px}
.disclaimer{background:rgba(229,72,77,.08); border:1px solid rgba(229,72,77,.3);
  border-radius:10px; padding:14px 18px; margin-top:24px; font-size:.85rem; color:#ffb3b5}
.disclaimer b{color:var(--red)}

/* 密碼門 */
#gate{position:fixed; inset:0; z-index:9999; background:#0d1117;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:radial-gradient(circle at 20% 0%,rgba(245,179,1,.08),transparent 45%),
                   radial-gradient(circle at 80% 10%,rgba(229,72,77,.08),transparent 45%);}
#gate .gate-card{background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:36px 32px; width:100%; max-width:360px; text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
#gate .gate-ic{font-size:2.6rem; margin-bottom:10px}
#gate h2{font-size:1.3rem; font-weight:800; margin-bottom:6px;
  background:linear-gradient(135deg,var(--gold),var(--red));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
#gate p{color:var(--muted); font-size:.85rem; margin-bottom:20px}
#gate input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:1rem; text-align:center; outline:none;
  transition:border-color .2s}
#gate input:focus{border-color:var(--gold)}
#gate button{width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--red)); color:#1a1200; font-weight:800;
  font-size:1rem; cursor:pointer; transition:transform .1s,opacity .2s}
#gate button:hover{opacity:.92}
#gate button:active{transform:scale(.98)}
#gate .gate-err{color:var(--red); font-size:.82rem; margin-top:12px; min-height:18px;
  opacity:0; transition:opacity .2s}
#gate .gate-err.show{opacity:1}
.gate-locked{overflow:hidden; height:100vh}

/* 最新開獎 */
.latest{display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:center}
.ball{width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:1.1rem; color:#fff; flex-shrink:0;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.4)}
.ball.z1{background:radial-gradient(circle at 35% 30%,#ff6b6f,var(--z1))}
.ball.z2{background:radial-gradient(circle at 35% 30%,#ffd24d,var(--gold)); color:#3a2c00}
.ball.sm{width:34px; height:34px; font-size:.9rem}
.plus{color:var(--muted); font-size:1.5rem; font-weight:300}

/* 機率長條 */
.chart{margin-top:10px}
.row{display:flex; align-items:center; gap:10px; margin:3px 0}
.row .lbl{width:30px; text-align:right; font-variant-numeric:tabular-nums;
  font-weight:700; font-size:.9rem; color:var(--muted)}
.row .track{flex:1; background:var(--panel2); border-radius:6px; height:22px; position:relative; overflow:hidden}
.row .fill{height:100%; border-radius:6px; transition:width .8s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#b3373b,var(--z1))}
.row.z2 .fill{background:linear-gradient(90deg,#caa000,var(--gold))}
.row .val{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-size:.78rem; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6)}
.row .pct{width:56px; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.theory-line{font-size:.82rem; color:var(--blue); margin:10px 0 4px}

/* 冷熱號網格 */
.grid-nums{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:8px; margin-top:8px}
.numbox{aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; border:1px solid var(--border);
  background:var(--panel2); position:relative; transition:transform .15s}
.numbox:hover{transform:translateY(-2px)}
.numbox .n{font-weight:800; font-size:1.05rem}
.numbox .c{font-size:.65rem; color:var(--muted)}

/* 預測卡片 */
.pred-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:8px}
.pred-card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:18px; position:relative}
.pred-card.featured{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold),0 4px 20px rgba(245,179,1,.15)}
.pred-card .tag{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--gold)}
.pred-card .tag .bf-badge{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; background:rgba(63,185,80,.15); border:1px solid rgba(63,185,80,.45); color:#7ee787; font-size:.62rem; font-weight:600; letter-spacing:0; text-transform:none; vertical-align:middle; cursor:help}
.pred-card .name{font-size:1.05rem; font-weight:700; margin:4px 0 12px}
.pred-card .balls{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.pred-card .desc{font-size:.78rem; color:var(--muted); margin-top:12px}
.badge{position:absolute; top:-10px; right:14px; background:var(--gold); color:#3a2c00;
  font-size:.7rem; font-weight:800; padding:3px 10px; border-radius:10px}

footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:40px; padding-top:20px; border-top:1px solid var(--border)}
footer a{color:var(--blue); text-decoration:none}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
.tab{background:var(--panel2); border:1px solid var(--border); color:var(--muted);
  padding:7px 16px; border-radius:8px; cursor:pointer; font-size:.88rem; transition:all .15s}
.tab.active{background:var(--gold); color:#3a2c00; border-color:var(--gold); font-weight:700}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:8px}
.stat-box{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center}
.stat-box .v{font-size:1.6rem; font-weight:800; color:var(--gold)}
.stat-box .k{font-size:.8rem; color:var(--muted); margin-top:4px}
@media(max-width:600px){header h1{font-size:1.6rem} .ball{width:38px;height:38px;font-size:1rem}}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-ic">🔒</div>
    <h2>威力彩號碼機率分析</h2>
    <p>本站需要密碼才能進入</p>
    <input id="gate-pw" type="password" placeholder="請輸入密碼" autocomplete="off" autofocus>
    <button id="gate-go">進入</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>
<div class="wrap">
<header>
  <h1>🎱 威力彩號碼機率分析</h1>
  <div class="sub">基於台灣彩券 <b id="m-first"></b> 至 <b id="m-last"></b> 全部開獎資料的統計與預測</div>
  <div class="meta-bar">
    <span class="meta-chip">總期數 <b id="m-total"></b></span>
    <span class="meta-chip">最新期別 <b id="m-period"></b></span>
    <span class="meta-chip">資料來源 <b>台灣彩券官方</b></span>
  </div>
</header>
<main id="app"></main>
<footer>
  <p>資料來源：台灣彩券股份有限公司官方 API · 統計截至 <span id="f-date"></span></p>
  <p style="margin-top:6px">本網站僅供統計研究與娛樂，樂透為獨立隨機事件，過往機率<b>不能</b>預測未來開獎結果。理性購彩，量力而為。</p>
</footer>
</div>
<script>
(function(){
  // 密碼門：repo 僅存 SHA-256 雜湊，不存明文密碼
  var HASH = "88c0b7cc68a4e06c46939c402b7adc73a8826285879cd73810ab0408d70c44fc";
  var KEY  = "superlotto_auth_v1";
  var gate = document.getElementById("gate");
  var input= document.getElementById("gate-pw");
  var btn  = document.getElementById("gate-go");
  var err  = document.getElementById("gate-err");
  var loaded = false;

  async function sha256(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){
      return b.toString(16).padStart(2,"0");
    }).join("");
  }

  function loadApp(){
    if(loaded) return; loaded = true;
    ["stats.js","app.js"].reduce(function(p,src){
      return p.then(function(){
        return new Promise(function(res,rej){
          var s=document.createElement("script");
          s.src=src; s.onload=res; s.onerror=rej;
          document.body.appendChild(s);
        });
      });
    }, Promise.resolve());
  }

  function unlock(){
    gate.style.display="none";
    document.documentElement.classList.remove("gate-locked");
    document.body.classList.remove("gate-locked");
    loadApp();
  }

  function showErr(msg){
    err.textContent = msg; err.classList.add("show");
    input.value=""; input.focus();
  }

  async function tryUnlock(){
    var v = input.value;
    if(!v){ showErr("請輸入密碼"); return; }
    var h = await sha256(v);
    if(h === HASH){
      try{ sessionStorage.setItem(KEY, "1"); }catch(e){}
      unlock();
    } else {
      showErr("密碼錯誤，請重新輸入");
    }
  }

  // 已驗證過（同分頁）直接放行
  try{ if(sessionStorage.getItem(KEY)==="1"){ unlock(); } }catch(e){}

  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); tryUnlock(); }
  });
  if(gate.style.display!=="none"){
    document.documentElement.classList.add("gate-locked");
    document.body.classList.add("gate-locked");
    input.focus();
  }
})();
</script>
</body>
</html>
